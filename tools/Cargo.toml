[workspace]
resolver = "2"
members = [
    "crates/toolcore",
    "crates/vpnctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["vcyber-tech"]
repository = "https://github.com/vcyber-tech/actions-rust"
homepage = "https://github.com/vcyber-tech/actions-rust"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "fs", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
owo-colors = "4"
fastrand = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
